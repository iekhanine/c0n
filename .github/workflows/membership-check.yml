name: C0N build and membership tests
on:
  push:
    branches:
      - feature/digital-membership
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/auth.test.js tests/images.test.js tests/membership.test.js tests/membership-roles.test.js tests/codenames.test.js tests/social-reputation.test.js tests/projects.test.js tests/project-moderation.test.js tests/starter-projects.test.js tests/social.test.js tests/site-content.test.js tests/publishing.test.js tests/staff.test.js
