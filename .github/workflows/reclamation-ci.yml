name: C0N Project Reclamation checks
on:
  pull_request:
    paths:
      - 'game/**'
      - 'bot/dice.js'
      - 'bot/dice.test.js'
      - 'bot/workshop-jobs.js'
      - 'bot/workshop-jobs.test.js'
      - 'server/workshop-jobs.js'
      - 'bot/index.js'
      - 'bot/Dockerfile'
      - 'server/reclamation.js'
      - 'src/Reclamation*.tsx'
      - 'api/social.js'
      - 'src/App.tsx'
      - '.github/workflows/reclamation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck and build
        run: npm run build
      - name: Check backend syntax
        run: |
          node --check game/server/engine.js
          node --check game/server/projects.js
          node --check game/server/storage.js
          node --check game/server/campaigns.js
          node --check game/server/economy.js
          node --check server/reclamation.js
      - name: Run backend unit tests
        run: node --test game/server/game.test.js
      - name: Install bot dependencies
        run: npm ci --prefix bot --ignore-scripts
      - name: Validate Discord bot and tabletop commands
        run: |
          node --check bot/index.js
          node --check bot/dice.js
          node --check bot/workshop-jobs.js
          node --check server/workshop-jobs.js
          node --test bot/dice.test.js bot/workshop-jobs.test.js
