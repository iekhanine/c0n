<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d0a"><link rel="icon" type="image/png" href="https://cultofnixon.com/con-logo.png"><title>The Compound | Cult of nix0n</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{--bg:#080d0a;--panel:#111913;--raised:#17221a;--border:#344b37;--cream:#e9eadf;--muted:#b8c7b4;--green:#a8ca85;--red:#e2a19b;--yellow:#ddcd97;font-family:'DM Sans',system-ui,sans-serif;font-size:16px;color:var(--cream);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);line-height:1.55}button,input,select{font:inherit}button,a{transition:background .12s,border-color .12s}a{color:var(--green)}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.shell{display:grid;grid-template-columns:254px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--border);background:#0e1610;position:sticky;top:0;height:100vh;overflow:auto;padding:21px 14px}.brand{display:flex;align-items:center;gap:13px;color:var(--cream);text-decoration:none;padding:8px 9px 24px;border-bottom:1px solid var(--border)}.brand img{width:54px;height:54px;object-fit:contain}.brand strong{font-size:20px;letter-spacing:.05em}.brand small{display:block;color:var(--green);font:12px/1.8 'IBM Plex Mono',monospace}.nav-label{margin:24px 11px 8px;font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.09em;color:var(--green)}.nav-link{display:flex;align-items:center;padding:11px 13px;min-height:46px;text-decoration:none;color:var(--muted);border:1px solid transparent;border-radius:3px;font-size:15px}.nav-link:hover,.nav-link[aria-current]{background:#203326;border-color:#506a50;color:#fff}.side-bottom{margin:30px 10px 15px;border-top:1px solid var(--border);padding-top:20px;color:var(--muted);font-size:13px}.main{min-width:0;padding:0 38px 70px;max-width:1480px;width:100%;margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:83px;gap:15px;border-bottom:1px solid var(--border)}.topbar span{font:13px 'IBM Plex Mono',monospace;color:var(--green)}.topbar .identity{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:14px}.topbar button{padding:8px 13px}.page-head{margin:36px 0 27px}.eyebrow{font:12px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--green);text-transform:uppercase}.page-head h1{font-size:32px;line-height:1.2;letter-spacing:-.025em;margin:10px 0}.page-head p{max-width:760px;color:var(--muted);margin:0;font-size:16px}.panel{background:var(--panel);border:1px solid var(--border);padding:23px;border-radius:4px}.panel h2{font-size:20px;margin:0 0 14px}.panel p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:15px}.stat{font:700 30px 'IBM Plex Mono',monospace;color:var(--green)}.hint{font-size:13px;color:var(--muted)}.btn,button{border:1px solid #60765b;border-radius:3px;background:#233627;color:#eff7e8;padding:10px 15px;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover,button:hover{background:#345039}.btn.primary,button.primary{background:var(--green);color:#172317;font-weight:700}.btn.primary:hover,button.primary:hover{background:#c5e1ae}.btn.danger,button.danger{color:#ffc6c0;border-color:#926260;background:#32201f}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.stack{display:grid;gap:15px}.notice{padding:16px 20px;border:1px solid #627448;color:#e1efcd;background:#1d2c20;margin:17px 0}.error{border-color:#91594f;background:#30201f;color:#ffcfca}.building{display:grid;gap:22px}.floor{background:#101a13;border:1px solid var(--border);padding:18px}.floor-head{margin-bottom:12px;color:var(--green);font:600 13px 'IBM Plex Mono',monospace}.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.unit{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:5px;background:#18251b;border:1px solid #46634a;min-height:110px;padding:13px}.unit:hover{background:#2c4131}.unit strong{font-size:18px}.unit small{font-size:13px;color:var(--muted);word-break:break-word}.unit.occupied{border-color:#746345;background:#211f17}.unit.mine{border-color:#b3d796;box-shadow:inset 0 0 0 1px #b3d796}.tablewrap{overflow-x:auto;border:1px solid var(--border)}table{width:100%;border-collapse:collapse;text-align:left;font-size:15px}th,td{padding:14px 15px;border-bottom:1px solid #2c3a2f;vertical-align:top}th{font:600 12px 'IBM Plex Mono',monospace;color:var(--green);letter-spacing:.05em;background:#19261c}tr:last-child td{border-bottom:0}.attributes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.attribute{padding:16px;border:1px solid #3a533c;background:#16231a}.attribute strong{display:block;font:700 23px 'IBM Plex Mono',monospace;color:var(--green)}.attribute span{font-size:13px;color:var(--muted)}.meter{height:7px;background:#263129;overflow:hidden;border-radius:2px;margin-top:12px}.meter>i{display:block;height:100%;background:var(--green)}.table-actions{display:flex;gap:7px;flex-wrap:wrap}.table-actions button{font-size:13px;min-height:35px;padding:7px 10px}.field{display:grid;gap:7px;font-size:14px;color:var(--muted)}.field input,.field select{width:100%;background:#0a120c;border:1px solid #506b53;border-radius:3px;min-height:43px;color:#fff;padding:9px 12px}.inline-form{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.inline-form .field{min-width:130px}.empty{padding:35px;border:1px dashed #53664f;color:var(--muted);font-size:16px}.login{max-width:660px;margin:13vh auto;border:1px solid #526e54;background:#152219;padding:40px}.login h1{font-size:33px}.login p{color:var(--muted);font-size:17px}.login img{height:78px}.login .btn{margin:18px 0}.tag{display:inline-block;padding:4px 9px;border:1px solid #507654;color:var(--green);font:12px 'IBM Plex Mono',monospace}.muted{color:var(--muted)}.space{margin-top:21px}.clickable{cursor:pointer}.load{padding:50px;text-align:center;color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:static;display:block;border-right:0;border-bottom:1px solid var(--border)}.sidebar nav{display:flex;gap:5px;overflow:auto}.nav-label{margin:15px 9px 4px}.nav-link{white-space:nowrap}.side-bottom{display:none}.brand{padding-bottom:14px}.main{padding:0 18px 50px}.units{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{min-height:65px}.page-head h1{font-size:27px}.panel{padding:16px}}
.public-sheet{max-width:800px;margin:7vh auto;padding:0 22px 40px}.public-card{background:linear-gradient(130deg,#233729,#0c1710);border:1px solid #64865f;border-radius:9px;padding:25px 29px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between}.public-card-top{display:flex;align-items:center;gap:15px;font:600 14px 'IBM Plex Mono',monospace;letter-spacing:.08em}.public-card-top img{height:65px;width:65px;object-fit:contain}.public-card h1{font-size:34px;margin:15px 0 3px;overflow-wrap:anywhere}.public-card .muted{font:13px 'IBM Plex Mono',monospace}.public-card-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid #426047;padding-top:18px;margin-top:23px}.public-stats{margin-top:20px}.history-list{display:grid;gap:0}.history-entry{padding:13px 0;border-bottom:1px solid #344b37;display:flex;justify-content:space-between;gap:20px;align-items:center}.history-entry:last-child{border-bottom:0}.history-entry small{display:block;color:var(--muted);font-size:12px}.history-points{white-space:nowrap;font:600 13px 'IBM Plex Mono',monospace;color:var(--green)}@media(max-width:600px){.public-sheet{margin:3vh auto}.public-card{padding:20px}.public-card h1{font-size:26px}}
</style></head><body><div id="app" class="load">Connecting to Cult of nix0n…</div>
<script>
"use strict";
const API="https://cultofnixon.com/api/social";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>Number(v||0).toLocaleString();
let me=null,flash="",err="";
const sections=[
 {name:"COMMUNITY",links:[["/","Overview"],["/apartments","Apartment building"],["/profile","My character"],["/requests","Housing requests"]]},
 {name:"GAME ADMINISTRATION",admin:true,links:[["/admin/residents","Member directory"],["/admin/apartments","Apartment management"],["/admin/requests","Approvals"],["/admin/progression","Progression controls"],["/admin/rules","XP & activity rules"],["/admin/audit","Audit history"]]},
 {name:"OTHER SYSTEMS",links:[["https://cultofnixon.com/admin","Community website admin"],["https://cultofnixon.com/admin/discord","Discord bot admin"]]}
];
async function call(action,body){const method=body?"POST":"GET";const resp=await fetch(API+"?action="+encodeURIComponent("compound_"+action),{method,credentials:"include",cache:"no-store",headers:body?{"Content-Type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined});let data=await resp.json().catch(()=>({error:"Could not read server response"}));if(!resp.ok)throw new Error(data.error||"Request failed");return data;}
function path(){return location.pathname.replace(/\/$/,"")||"/"}
function head(title,description){return '<header class="page-head"><div class="eyebrow">C0N / THE COMPOUND</div><h1>'+esc(title)+'</h1><p>'+esc(description)+'</p></header>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>'}
function notice(){let n=(err?'<div role="alert" class="notice error">'+esc(err)+'</div>':'')+(flash?'<div role="status" class="notice">'+esc(flash)+'</div>':'');err="";flash="";return n}
function appFrame(content){
const loc=path(),isAdmin=me.is_admin;
return '<div class="shell"><aside class="sidebar"><a class="brand" href="/"><img src="https://cultofnixon.com/con-logo.png" alt="C0N"><div><strong>THE COMPOUND</strong><small>CULT OF NIX0N</small></div></a><nav aria-label="Compound navigation" style="display:block">'+sections.filter(s=>!s.admin||isAdmin).map(s=>'<div class="nav-label">'+esc(s.name)+'</div>'+s.links.map(([url,label])=>'<a class="nav-link" '+(loc===url?'aria-current="page"':'')+' href="'+esc(url)+'">'+esc(label)+'</a>').join("")).join("")+'</nav><div class="side-bottom">CHARACTER SYSTEM / LIVE DATABASE<br>Powered by Discord identity</div></aside><div class="main"><header class="topbar"><span>THE COMPOUND / '+esc(loc.toUpperCase())+'</span><div class="identity">'+esc(me.user.name)+' <span class="tag">'+(isAdmin?'STAFF':'RESIDENT')+'</span><a href="https://cultofnixon.com/" style="font-size:13px">C0N</a></div></header>'+notice()+content+'</div></div>';
}
function login(error){
document.getElementById("app").className="";
document.getElementById("app").innerHTML='<div class="login"><img src="https://cultofnixon.com/con-logo.png" alt="C0N"><div class="eyebrow">CULT OF NIX0N / THE COMPOUND</div><h1>Enter The Compound</h1><p>Sign in with your existing Discord identity. Apartment assignments, characters, and approvals are saved to the real C0N database, not browser storage.</p><a class="btn primary" href="https://cultofnixon.com/api/auth/discord/login?next=compound">Continue with Discord</a><p class="hint">You will authorize through cultofnixon.com and return here automatically. Existing C0N session holders can simply refresh.</p>'+(error?'<p class="notice error">'+esc(error)+'</p>':'')+'</div>';
}
function attr(key,value){return '<div class="attribute"><strong>'+num(value)+'</strong><span>'+esc(key)+'</span>'+(key==="XP"?'':'<div class="meter"><i style="width:'+Math.max(0,Math.min(100,Number(value)))+'%"></i></div>')+'</div>'}
async function overview(){const a=await call("apartments"),r=await call("requests");let home=me.home?.apartment_id||"Unassigned";return head("Welcome to The Compound","Your resident overview, progression and active housing status.")+
 '<div class="grid"><div class="panel"><div class="eyebrow">YOUR APARTMENT</div><div class="stat">'+esc(home)+'</div><p>Permanent until an approved move</p><a href="/apartments" class="btn">View the building</a></div><div class="panel"><div class="eyebrow">EXPERIENCE POINTS</div><div class="stat">'+num(me.profile.xp)+'</div><p>Level '+num(me.profile.level)+'</p><a href="/profile" class="btn">Character sheet</a></div><div class="panel"><div class="eyebrow">HOUSING REQUESTS</div><div class="stat">'+num(r.requests.filter(x=>x.status==="pending"&&x.requester_id===me.user.id).length)+'</div><p>Requests awaiting decisions</p><a href="/requests" class="btn">View requests</a></div><div class="panel"><div class="eyebrow">OCCUPIED UNITS</div><div class="stat">'+a.apartments.filter(x=>x.occupants.length).length+' / 32</div><p>Real resident assignments</p><a href="/apartments" class="btn">Browse floors</a></div></div>'+
 '<div class="panel space"><h2>Community systems</h2><p>The Compound is distinct from the community website and Discord bot. Each has its own management tools and access rules.</p><div class="row"><a class="btn" href="https://cultofnixon.com/">Community website</a><a class="btn" href="https://cultofnixon.com/admin/discord">Discord bot admin</a></div></div>';
}
function apartmentButton(a){const people=a.occupants;let label=people.length?people.map(p=>p.name).join(", "):"Vacant";let own=people.some(p=>p.id===me.user.id);return '<button class="unit '+(own?'mine ':people.length?'occupied':'')+'" data-action="apartment" data-id="'+esc(a.id)+'"><strong>'+esc(a.id)+'</strong><small>'+esc(label)+'</small><small>'+num(people.length)+' / '+num(a.capacity)+' residents'+(a.locked?' · Locked':'')+'</small></button>';}
async function apartments(){const d=await call("apartments");window._apartments=d.apartments;return head("The apartment building","Select an apartment to claim a vacant home or submit a transfer or roommate request.")+'<div class="building">'+[4,3,2,1].map(f=>'<section class="floor"><div class="floor-head">FLOOR '+f+'</div><div class="units">'+d.apartments.filter(a=>a.floor===f).map(apartmentButton).join("")+'</div></section>').join("")+'</div>';}
async function profile(){const p=me.profile;const data=await call("history");return head("Character profile","Real statistics linked to your Discord account.")+'<div class="panel"><div class="row"><div><div class="eyebrow">RESIDENT</div><h2 style="font-size:27px">'+esc(me.user.name)+'</h2><p>Discord ID: '+esc(me.user.id)+'</p></div><span class="tag">LEVEL '+num(p.level)+'</span></div><div class="attributes">'+[["XP",p.xp],["Health",p.health],["Stamina",p.stamina],["Skill",p.skill],["Charisma",p.charisma],["Intellect",p.intellect],["Luck",p.luck]].map(x=>attr(...x)).join("")+'</div><p class="hint space">Discord activity XP: '+num(p.activity_xp)+' · Trivia XP: '+num(p.trivia_xp)+' · Staff adjustments: '+num(p.manual_xp)+'</p></div>'+
 '<section class="panel space"><h2>My progression history</h2><p class="hint">Your latest 100 recorded awards. Each entry shows why your character received its XP or attributes.</p>'+
 (data.events.length?'<div class="history-list">'+data.events.map(e=>'<div class="history-entry"><div><strong>'+esc(e.description)+'</strong><small>'+esc(new Date(e.occurred_at).toLocaleString())+(e.details?.channel_id?' · Channel ID '+esc(e.details.channel_id):'')+'</small></div><span class="history-points">'+(e.xp_delta>=0?'+':'')+num(e.xp_delta)+' XP'+(e.charisma_delta?' · +'+num(e.charisma_delta)+' Charisma':'')+(e.intellect_delta?' · +'+num(e.intellect_delta)+' Intellect':'')+'</span></div>').join("")+'</div>':'<div class="empty">No recorded progression yet.</div>')+'</section>'}
const statusTag=s=>'<span class="tag">'+esc(s.toUpperCase())+'</span>';
async function requests(){let d=await call("requests");let rows=d.requests.map(q=>'<tr><td>'+esc(q.requester_name)+'</td><td>'+esc(q.kind)+'</td><td>'+esc(q.apartment_id)+'</td><td>'+statusTag(q.status)+'</td><td>'+esc(new Date(q.created_at).toLocaleString())+'</td><td>'+((q.status==="pending"&&q.requester_id!==me.user.id)?'<div class="table-actions"><button data-action="consent" data-id="'+esc(q.id)+'" data-val="true">Consent</button><button data-action="consent" data-id="'+esc(q.id)+'" data-val="false" class="danger">Decline</button></div>':q.staff_approved?'Staff approved':'')+'</td></tr>');return head("Housing requests","Transfers require staff approval. Moving in with residents requires their unanimous consent as well.")+(rows.length?table(["Requester","Type","Apartment","Status","Submitted","Your action"],rows):'<div class="empty">No housing requests found.</div>')}
async function residents(){const d=await call("residents");window._residents=d.residents;return head("Member directory","Discord-linked residents and permanently assigned apartments.")+table(["Member","Discord ID","Level","XP","Apartment","Actions"],d.residents.map(p=>'<tr><td>'+esc(p.display_name)+'</td><td>'+esc(p.discord_id)+'</td><td>'+num(p.level)+'</td><td>'+num(p.xp)+'</td><td>'+esc(p.apartment_id||"Unassigned")+'</td><td><div class="table-actions"><button data-action="place" data-id="'+esc(p.discord_id)+'">Assign vacant</button>'+(p.apartment_id?'<button class="danger" data-action="unassign" data-id="'+esc(p.discord_id)+'">Unassign</button>':'')+'</div></td></tr>'))}
async function manageApartments(){const d=await call("apartments");return head("Apartment management","Occupancy records are authoritative. Move requests are handled on the approvals page.")+table(["Unit","Floor","Capacity","Residents","Status","Settings"],d.apartments.map(a=>'<tr><td>'+esc(a.id)+'</td><td>'+a.floor+'</td><td>'+num(a.capacity)+'</td><td>'+esc(a.occupants.map(x=>x.name).join(", ")||"Vacant")+'</td><td>'+esc(a.locked?"Locked":a.occupants.length>=a.capacity?"Full":"Available")+'</td><td><div class="table-actions"><button data-action="settings" data-id="'+esc(a.id)+'" data-cap="'+num(a.capacity)+'" data-lock="'+String(a.locked)+'">Capacity / lock</button></div></td></tr>'))}
async function approvals(){const d=await call("requests");let rows=d.requests.filter(q=>q.status==="pending").map(q=>'<tr><td>'+esc(q.requester_name)+'</td><td>'+esc(q.kind)+'</td><td>'+esc(q.apartment_id)+'</td><td>'+q.staff_approved?'':'');
rows=d.requests.filter(q=>q.status==="pending").map(q=>'<tr><td>'+esc(q.requester_name)+'</td><td>'+esc(q.kind)+'</td><td>'+esc(q.apartment_id)+'</td><td>'+(q.staff_approved?'Yes':'Pending')+'</td><td>'+esc(Object.keys(q.consents||{}).length)+' consent(s)</td><td><div class="table-actions"><button data-action="decision" data-id="'+esc(q.id)+'" data-val="true">Approve</button><button data-action="decision" data-id="'+esc(q.id)+'" data-val="false" class="danger">Deny</button></div></td></tr>');
return head("Housing approvals","Staff approval and existing-occupant consent are separate requirements. Approval only completes when all conditions are satisfied.")+(rows.length?table(["Resident","Request","Apartment","Staff","Roommate consent","Decision"],rows):'<div class="empty">No housing approvals are waiting.</div>')}
async function progression(){const d=await call("residents");window._residents=d.residents;let opts=d.residents.map(p=>'<option value="'+esc(p.discord_id)+'">'+esc(p.display_name)+' ('+esc(p.discord_id)+')</option>').join("");
return head("Character progression","Manage XP and character attributes. Every adjustment is audited.")+'<div class="panel"><h2>Edit resident statistics</h2><form id="stat-form" class="inline-form"><label class="field">Member<select name="discord_id" required>'+opts+'</select></label><label class="field">Attribute<select name="field"><option value="xp">XP</option><option value="health">Health</option><option value="stamina">Stamina</option><option value="skill">Skill</option><option value="charisma">Charisma</option><option value="intellect">Intellect</option><option value="luck">Luck</option></select></label><label class="field">New value<input type="number" min="0" max="1000000" name="value" required value="100"></label><button class="primary" type="submit">Save value</button></form><p class="hint space">All values except XP are limited to 0–100. XP can be 0–1,000,000.</p></div>'}
async function rules(){const d=await call("rules");const r=d.rules;
return head("XP & activity rules","Real Discord participation events feed character XP. Daily caps limit farming and spam.")+'<div class="panel"><h2>Activity XP policy</h2><form id="rules-form" class="inline-form">'+[["message_xp","XP per message"],["reaction_xp","XP per reaction"],["daily_message_cap","Daily message cap"],["daily_reaction_cap","Daily reaction cap"]].map(([name,label])=>'<label class="field">'+label+'<input required type="number" min="0" max="500" name="'+name+'" value="'+num(r[name])+'"></label>').join("")+'<button class="primary" type="submit">Save XP rules</button></form><p class="hint space">Existing participation events are counted once, from the connected C0N Discord server. The new policy takes effect when a character is refreshed.</p></div>'}
async function audit(){const d=await call("audit");return head("Audit history","Recorded actions for apartment claims, transfers, approvals and progression changes.")+(d.events.length?table(["Date","Actor Discord ID","Event","Subject","Details"],d.events.map(e=>'<tr><td>'+esc(new Date(e.created_at).toLocaleString())+'</td><td>'+esc(e.actor_id)+'</td><td>'+esc(e.action)+'</td><td>'+esc(e.subject_id||"")+'</td><td><code>'+esc(JSON.stringify(e.details))+'</code></td></tr>')):'<div class="empty">No activity has been recorded.</div>')}
async function publicProfile(id){
 const data=await call("public_profile&id="+encodeURIComponent(id));
 const m=data.member,p=data.stats;
 const identity=m.membership;
 document.title=(identity?.codename||m.display_name)+" | The Compound";
 return '<main class="public-sheet" aria-label="Public character profile">'+
 '<section class="public-card" aria-label="Membership card">'+
 '<div class="public-card-top"><img src="https://cultofnixon.com/con-logo.png" alt="Cult of nix0n"><div>CULT OF NIX0N<div class="muted">THE COMPOUND / MEMBERSHIP</div></div></div>'+
 '<div><h1>'+esc(identity?.codename||m.display_name)+'</h1><div class="muted">'+(identity?'VERIFIED MEMBER · #'+esc(identity.member_no):'COMPOUND RESIDENT · MEMBERSHIP NOT ISSUED')+'</div></div>'+
 '<div class="public-card-bottom"><div><span class="eyebrow">APARTMENT</span><div><strong>'+esc(m.apartment)+'</strong></div></div><div><span class="eyebrow">RESIDENT</span><div><strong>'+esc(m.display_name)+'</strong></div></div></div></section>'+
 '<section class="panel public-stats" aria-label="Character statistics"><div class="row"><h2>Character Stats</h2><span class="tag">LEVEL '+num(p.level)+'</span></div>'+
 '<div class="attributes">'+[["XP",p.xp],["Health",p.health],["Stamina",p.stamina],["Skill",p.skill],["Charisma",p.charisma],["Intellect",p.intellect],["Luck",p.luck]].map(x=>attr(...x)).join("")+'</div></section></main>';
}
async function render(){
const el=document.getElementById("app");el.className="";el.innerHTML='<div class="load">Loading…</div>';
const publicId=path().match(/^\/u\/(\d{17,20})$/)?.[1];
if(publicId){try{el.innerHTML=await publicProfile(publicId);}catch(e){el.innerHTML='<div class="public-sheet"><div class="empty">'+esc(e.message)+'</div></div>';}return;}

try{
me=await call("me");const routes={"/":overview,"/apartments":apartments,"/profile":profile,"/requests":requests,"/admin/residents":residents,"/admin/apartments":manageApartments,"/admin/requests":approvals,"/admin/progression":progression,"/admin/rules":rules,"/admin/audit":audit};
let target=routes[path()];let isAdmin=path().startsWith("/admin/");
if(isAdmin&&!me.is_admin){err="Game staff permissions required.";target=overview;}
if(!target){err="That page does not exist.";target=overview;}
el.innerHTML=appFrame(await target());
bind();
}catch(e){if(String(e.message).includes("Sign in"))login("");else login(e.message);}
}
async function perform(action,body){try{await call(action,body);flash="Saved successfully.";err="";await render();}catch(e){err=e.message;flash="";await render();}}
function bind(){
document.querySelectorAll('a[href^="/"]').forEach(a=>a.addEventListener("click",e=>{e.preventDefault();history.pushState({},"",a.getAttribute("href"));render()}));
document.querySelectorAll('[data-action="apartment"]').forEach(b=>b.addEventListener("click",async()=>{
const a=window._apartments.find(x=>x.id===b.dataset.id);if(!a)return;
if(a.occupants.some(p=>p.id===me.user.id)){flash="You already live here.";return render();}
if(a.locked){err="This apartment is locked.";return render();}
const mode=me.home||a.occupants.length?"request":"claim";
if(!confirm((mode==="claim"?"Claim ":"Request to move into ")+a.id+"?"))return;
perform(mode,{"apartment_id":a.id});
}));
document.querySelectorAll('[data-action="decision"],[data-action="consent"]').forEach(b=>b.addEventListener("click",()=>{const action=b.dataset.action;if(!confirm((b.dataset.val==="true"?"Approve ":"Decline ")+ "this request?"))return;perform(action,{id:b.dataset.id,approve:b.dataset.val==="true"});}));
const rulesForm=document.getElementById("rules-form");if(rulesForm)rulesForm.addEventListener("submit",e=>{e.preventDefault();const d=new FormData(rulesForm);perform("rules",Object.fromEntries([...d.entries()].map(([k,v])=>[k,Number(v)])));});
document.querySelectorAll('[data-action="settings"]').forEach(b=>b.addEventListener("click",()=>{
const value=prompt("Capacity for "+b.dataset.id+" (1–8)",b.dataset.cap);if(value===null)return;
const cap=Number(value);const locked=confirm("Lock this apartment against new assignments? OK = locked, Cancel = unlocked.");
perform("apartment",{apartment_id:b.dataset.id,capacity:cap,locked});
}));
document.querySelectorAll('[data-action="place"]').forEach(b=>b.addEventListener("click",()=>{
const id=prompt("Assign this resident to which VACANT apartment? Example: F2-03");if(!id)return;
if(!confirm("Assign resident to "+id+"? Existing roommates require a housing request."))return;
perform("place",{discord_id:b.dataset.id,apartment_id:id});
}));
document.querySelectorAll('[data-action="unassign"]').forEach(b=>b.addEventListener("click",()=>{
if(!confirm("Remove this resident's permanent apartment assignment?"))return;
perform("unassign",{discord_id:b.dataset.id});
}));
const form=document.getElementById("stat-form");if(form)form.addEventListener("submit",e=>{e.preventDefault();const d=new FormData(form);perform("adjust",{discord_id:d.get("discord_id"),field:d.get("field"),value:Number(d.get("value"))})});
}
window.addEventListener("popstate",render);
render();
</script></body></html>
